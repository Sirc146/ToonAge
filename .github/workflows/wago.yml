name: Publish to Wago

# CurseForge and Wago uploads run from release.yml (one BigWigs packager
# invocation per v* tag). This file used to upload on its own, and it passed
# -d to the packager, which skips every upload. It no longer runs on tags,
# so a release cannot be published twice.

on:
  workflow_dispatch:

jobs:
  moved:
    runs-on: ubuntu-latest
    steps:
      - name: Publishing lives in release.yml
        run: echo "CurseForge and Wago uploads run from .github/workflows/release.yml on v* tags."
