name: Tests

# The offline verification suite. Every check here already runs locally before
# a change ships; this is the guarantee that it ran, on a machine nobody
# configured by hand, for every push and every pull request.
#
# GitHub Actions runs .github/workflows/ci.yml. That file is this one.
# Edit both, or copy this file over that one, so they do not drift.
#
# Two independent gates, because they catch different things:
#
#   check_lua.py   parses every .lua file the TOCs list. It proves syntax and
#                  nothing more -- a file can parse perfectly and still be
#                  wrong -- but a parse failure means the addon is broken for
#                  every player on that flavour, so it runs first and cheapest.
#
#   test_*.py      the real suites. They execute Core/Environment.lua,
#                  Core/Profile.lua and Core/Init.lua in an embedded Lua 5.1
#                  runtime under stubbed clients, and assert structure across
#                  the TOCs, profiles, data files and modules.
#
# Both need dependencies that are not in the standard library (luaparser,
# lupa). They are declared in Tools/requirements.txt precisely so a fresh
# machine does not rediscover them one error at a time.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch makes an in-flight run irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Tools/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r Tools/requirements.txt

      - name: Parse every Lua file listed in the TOCs
        # check_lua.py defaults to ToonAge.toc. A syntax error that exists
        # only in a flavor TOC (Mists, TBC, Forever, Classic Era) would
        # otherwise ship. Each TOC is its own group so the log says which
        # flavor failed.
        run: |
          set -u
          failed=""
          for toc in ToonAge*.toc; do
            echo "::group::$toc"
            if python Tools/check_lua.py --toc "$toc"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$toc::$toc failed Lua parse"
              failed="$failed $toc"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed TOCs:$failed"
            exit 1
          fi

      - name: Run the verification suites
        # Every Tools/test_*.py is run, and the job fails if any one of them
        # does. The loop reports each suite by name rather than stopping at the
        # first failure, so one push tells you everything that broke instead of
        # the first thing.
        run: |
          set -u
          failed=""
          for suite in Tools/test_*.py; do
            echo "::group::$suite"
            if python "$suite"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$suite::$suite failed"
              failed="$failed $suite"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed suites:$failed"
            exit 1
          fi
          echo "All suites passed."
