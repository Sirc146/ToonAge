name: Package and Release

# One v* tag publishes one zip.
#   1. BigWigsMods/packager v2.7.0 builds that zip. The TOC version is
#      stamped in the checkout first, so the file the packager zips already
#      carries the tag. Nothing here commits that stamp.
#   2. Tools/check_release_zip.py runs inside that same packager process,
#      after the zip exists and before any upload. A mismatch exits before
#      CurseForge, Wago, or GitHub receive a file.
#   3. The packager then uploads that zip to CurseForge and Wago. A missing
#      token skips that store. softprops publishes the same zip, the manifest,
#      and release.json to GitHub. The packager is not given a GitHub token,
#      so it does not create a second release.
# A second packager run is not used. -o keeps the package directory and -c
# skips the copy, but release.sh still deletes and recreates the zip, and
# that new zip is not the one that was checked.
# workflow_dispatch builds the same zip and manifest and uploads nothing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into every TOC. This run uploads nothing.
        required: false
        default: '2.0.0-dev.1'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The packager reads the tag and changelog from git history.
          fetch-depth: 0

      - name: Get version from tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          case "$version" in
            ""|*[!A-Za-z0-9._-]*)
              echo "Refusing a version with empty or unsupported characters." >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the TOC files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          n=0
          for toc in *.toc; do
            n=$((n + 1))
            sed -i "s/^## Version: .*/## Version: ${VERSION}/" "$toc"
          done
          if [ "$n" -ne 8 ]; then
            echo "Expected 8 TOC files at the addon root." >&2
            exit 1
          fi

      - name: Fetch the pinned packager
        # BigWigsMods/packager v2.7.0 (2026-11-05).
        # -d skips upload. -n sets the zip file name. Both exist in this revision.
        run: |
          set -euo pipefail
          pin=01e8631a69c69d7654c788d152630d5fed9e3812
          dest="${RUNNER_TEMP}/packager"
          rm -rf "$dest"
          git init -q "$dest"
          git -C "$dest" fetch --depth 1 -q "https://github.com/BigWigsMods/packager.git" "$pin"
          git -C "$dest" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dest" rev-parse HEAD)" = "$pin"
          echo "packager=$dest" >> "$GITHUB_OUTPUT"
        id: packager

      - name: Are CurseForge or Wago tokens configured?
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$CF_API_KEY" ]; then
            echo "CurseForge token is set."
          else
            echo "CF_API_KEY is not set. CurseForge upload will be skipped."
          fi
          if [ -n "$WAGO_API_TOKEN" ]; then
            echo "Wago token is set."
          else
            echo "WAGO_API_TOKEN is not set. Wago upload will be skipped."
          fi

      - name: Build one package
        id: package
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGER: ${{ steps.packager.outputs.packager }}
          TOONAGE_VERSION: ${{ steps.version.outputs.version }}
          TOONAGE_MANIFEST: ${{ github.workspace }}/release-manifest.json
          TOONAGE_CHECKER: ${{ github.workspace }}/Tools/check_release_zip.py
        run: |
          set -euo pipefail
          command -v zip >/dev/null
          command -v jq >/dev/null
          command -v curl >/dev/null
          python3 Tools/insert_release_gate.py "${PACKAGER}/release.sh"
          # A dry run must not publish. Drop the store tokens and pass -d,
          # which skips every upload in packager v2.7.0.
          # GH_API_TOKEN, GITHUB_API_TOKEN, and GITHUB_OAUTH are the names
          # release.sh reads for its own GitHub release. Leave them unset.
          unset GH_API_TOKEN GITHUB_API_TOKEN GITHUB_OAUTH
          args=(-n "ToonAge-${VERSION}:")
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "workflow_dispatch dry run: uploads are skipped."
            unset CF_API_KEY CF_API_TOKEN WAGO_API_TOKEN
            args+=(-d)
          fi
          bash "${PACKAGER}/release.sh" "${args[@]}"
          mapfile -t zips < <(find .release -name 'ToonAge-*.zip' -type f | sort)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected one release zip, found ${#zips[@]}." >&2
            exit 1
          fi
          test -s release-manifest.json
          echo "archive_path=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Confirm the zip on disk matches the manifest
        env:
          ARCHIVE: ${{ steps.package.outputs.archive_path }}
        run: |
          set -euo pipefail
          python3 Tools/check_release_zip.py --require-zip-sha release-manifest.json "$ARCHIVE"

      - name: Upload the zip and manifest
        uses: actions/upload-artifact@v4
        with:
          name: toonage-${{ steps.version.outputs.version }}
          path: |
            release-manifest.json
            ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error

      - name: Write release.json (flavor map for WowUp / addon managers)
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive_path }}
        run: |
          set -euo pipefail
          filename="$(basename "$ARCHIVE")"
          cat > release.json <<JSON
          {
            "releases": [
              {
                "name": "ToonAge $VERSION",
                "version": "$VERSION",
                "filename": "$filename",
                "nolib": false,
                "metadata": [
                  { "flavor": "mainline", "interface": 120100 },
                  { "flavor": "bcc",      "interface": 20506  },
                  { "flavor": "mists",    "interface": 50504  },
                  { "flavor": "classic",  "interface": 11509  },
                  { "flavor": "cata",     "interface": 40402  },
                  { "flavor": "wrath",    "interface": 30405  },
                  { "flavor": "forever",  "interface": 16001  }
                ]
              }
            ]
          }
          JSON
          cat release.json

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive_path }}
            release.json
            release-manifest.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'dev') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'test') }}

      - name: Verify the published GitHub zip
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive_path }}
        run: |
          set -euo pipefail
          name="$(basename "$ARCHIVE")"
          mkdir -p downloaded
          ok=0
          for _try in 1 2 3 4 5; do
            if gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir downloaded --clobber; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "The GitHub release zip was not available to verify." >&2
            exit 1
          fi
          python3 Tools/check_release_zip.py --require-zip-sha release-manifest.json "downloaded/$name"
