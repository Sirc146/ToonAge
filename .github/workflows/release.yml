name: Package and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Package addon ZIP
        run: |
          mkdir -p release/ToonAge
          # Copy only addon files (exclude dev-only folders)
          rsync -a --exclude='.git' \
                   --exclude='.github' \
                   --exclude='Tools' \
                   --exclude='Docs' \
                   --exclude='.claude' \
                   --exclude='__pycache__' \
                   --exclude='*.pyc' \
                   ./ release/ToonAge/
          cd release
          zip -r ../ToonAge-${{ steps.version.outputs.version }}.zip ToonAge/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ToonAge-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'dev') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
